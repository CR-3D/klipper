# Example: one pre-feeder with a spring buffer, autonomous feeding, retract
# and automatic loading (see docs/Buffer_Feed.md)
#
#   entry_pin_t0 -> pre-feeder t0 -> exit_pin_t0 -> gate_pin -> buffer
#                                                  (buffer_low_pin /
#                                                   buffer_high_pin)
#
# For one buffer per IDEX head use two [buffer_feed] sections, one with
# channel t0 and one with channel t1. For two pre-feeders into a Y splitter
# with one buffer see sample-buffer-feed-dual.cfg.
#
# Everything time critical runs on the MCU of the station board. The host is
# not part of the timing path.

[mcu station]
canbus_uuid: 0123456789ab

# The pre-feeder. It can be a manual_stepper or an extruder_stepper. It must
# be on the same MCU as the sensors and use "step on both edges" (TMC drivers
# with step/dir do so as long as step_pulse_duration is not set).
[manual_stepper prefeeder_t0]
step_pin: station:STATION_STEPPER_T0_STEP
dir_pin: station:STATION_STEPPER_T0_DIR
enable_pin: !station:STATION_STEPPER_T0_EN
microsteps: 16
rotation_distance: 22
gear_ratio: 50:10
full_steps_per_rotation: 200
velocity: 50
accel: 5000

[tmc2209 manual_stepper prefeeder_t0]
uart_pin: station:STATION_STEPPER_T0_UART
interpolate: false
run_current: 0.70
sense_resistor: 0.110
stealthchop_threshold: 0

[buffer_feed buffer_t0]
# --- Buffer -------------------------------------------------------------------
# Buffer nearly empty - starts feeding
buffer_low_pin: ^station:STATION_T0_BUF0
# Buffer full - ends feeding and starts a retract (optional)
buffer_high_pin: ^station:STATION_T0_BUF2
# Filament has arrived at the buffer: feeding only while active (optional)
gate_pin: ^station:STATION_T0_BUF1

# --- Channel t0 -----------------------------------------------------------------
stepper_t0: manual_stepper prefeeder_t0
# Entry sensor before the pre-feeder: starts loading, detects a runout
entry_pin_t0: ^station:STATION_T0_SW0
# Exit sensor after the pre-feeder: ends loading
exit_pin_t0: ^station:STATION_T0_SW1

# --- Feeding --------------------------------------------------------------------
# Distance per feed run (mm). Choose it so that buffer_high_pin is not
# normally reached.
distance: 40
# Feed velocity (mm/s), acceleration and deceleration (mm/s^2)
velocity: 30
accel: 2000
#decel: 2000            # default: accel
#start_velocity: 2.0    # start/end velocity of the ramps (mm/s)
# If buffer_low_pin is still active after this many runs in a row, this is a
# fault (or a runout if the entry sensor has no filament).
#max_runs: 3
#poll_interval: 0.005   # sensor poll interval on the MCU (s)
#buffer_low_debounce: 0.010
#buffer_high_samples: 2
fault_gcode:
  M118 Buffer {params.BUFFER}: filament is not fed ({params.REASON})
# Runout: no filament at the entry sensor. No fault, feeding of the channel
# pauses until filament is inserted. The print is paused by the printer's
# own filament sensor.
runout_gcode:
  M118 Buffer {params.BUFFER}: channel {params.CHANNEL} ran out of filament

# --- Retract --------------------------------------------------------------------
# When buffer_high_pin triggers (eg long retraction, unloading through the
# extruder) move back until it releases, at most this distance per run (mm).
# 0 = off.
retract_distance: 5

# --- Loading (entry -> exit) ------------------------------------------------------
#load_velocity: 30      # default: velocity
#load_accel: 2000       # default: accel
#load_decel: 2000       # default: load_accel
#load_start_velocity: 2 # default: start_velocity
# If the exit sensor does not trigger within this time (s): abort and error
load_timeout: 45
# Distance (mm) after the exit sensor triggered. Positive = further forward
# (deceleration included), negative = stop and move back (preload position).
load_clear_distance: -2
#entry_debounce: 0.010
#exit_samples: 2
load_fault_gcode:
  M118 Buffer {params.BUFFER}: loading {params.CHANNEL} failed, filament did not reach the exit sensor

# Enable feeding and loading at startup (default: True)
#enable: True
# Switch the driver on when needed (default: True)
#enable_stepper: True


# --- Buttons --------------------------------------------------------------------
# BUFFER_FEED_MOVE returns at once, the MCU runs the move on its own and stops
# (with deceleration) at the selected sensor. Negative DISTANCE = backwards.
# If another move follows, wait for the end with WAIT=1, otherwise the MCU
# refuses the second command as "busy".
#
# Macro names must not contain digits followed by letters: FEEDER1_LOAD would
# be parsed as FEEDER1. Use FEEDER_LOAD_T0.

# Button 1: load until the buffer is full
[gcode_button feeder_load_t0]
pin: ^!station:STATION_T0_BUT0
press_gcode:
  FEEDER_LOAD_T0

[gcode_macro FEEDER_LOAD_T0]
gcode:
  SET_BUFFER_FEED BUFFER=buffer_t0 FEED=1
  BUFFER_FEED_MOVE BUFFER=buffer_t0 DISTANCE=3000 STOP=high

# Button 2: unload until the filament has left the entry sensor. Switch
# feeding and loading off first (this aborts a running move), otherwise the
# buffer feeds again while moving back. Switch loading on again at the end.
[gcode_button feeder_unload_t0]
pin: ^!station:STATION_T0_BUT1
press_gcode:
  FEEDER_UNLOAD_T0

[gcode_macro FEEDER_UNLOAD_T0]
gcode:
  SET_BUFFER_FEED BUFFER=buffer_t0 FEED=0 AUTO_LOAD=0
  BUFFER_FEED_MOVE BUFFER=buffer_t0 DISTANCE=-2000 STOP=exit STOP_ON=RELEASE WAIT=1
  BUFFER_FEED_MOVE BUFFER=buffer_t0 DISTANCE=-600 STOP=entry STOP_ON=RELEASE WAIT=1
  SET_BUFFER_FEED BUFFER=buffer_t0 AUTO_LOAD=1
