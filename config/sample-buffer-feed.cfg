# Beispiel: Vorfördereinheit mit Federpuffer, autonomem Nachschieben und
# automatischem Laden (siehe docs/Buffer_Feed.md)
#
# Aufbau:  Sensor 1 -> Vorförderer -> Sensor 2 -> Sensor 3 -> Puffer
#          (entry_pin)              (exit_pin)    (gate_pin)
#          Puffer-Sensoren: trigger_pin (fast leer), stop_pin (voll)
#
# Alles Zeitkritische läuft in der MCU des Station Boards. Der Host ist im
# Zeitpfad nicht beteiligt.

[mcu station]
canbus_uuid: 0123456789ab

# Der Vorförderer. Es kann ein manual_stepper oder ein extruder_stepper sein
# (z.B. synchron zum Extruder). Der Stepper muss auf der selben MCU liegen
# wie die Sensoren und "step on both edges" nutzen (TMC-Treiber mit Step/Dir
# tun das automatisch, solange step_pulse_duration nicht gesetzt ist).
[extruder_stepper feeder1]
extruder: extruder
step_pin: station:PB1
dir_pin: !station:PB2
enable_pin: !station:PB3
microsteps: 16
rotation_distance: 22.6

[tmc2209 extruder_stepper feeder1]
uart_pin: station:PA9
run_current: 0.6

[buffer_feed feeder1]
stepper: extruder_stepper feeder1

# --- Nachschieben (Federpuffer) --------------------------------------------
# Sensor "Puffer fast leer" - löst das Nachschieben aus
trigger_pin: ^!station:PA5
# Sensor "Puffer voll" - beendet das Nachschieben (optional). Er darf
# überfahren werden: der Stepper bremst mit der Rampe 'decel' ab.
stop_pin: ^!station:PA6
# Sensor 3 (optional): Nachschieben ist nur aktiv, solange er ausgelöst ist
gate_pin: ^!station:PA4
# Pro Auslösung nachgeschobene Strecke (mm)
distance: 20
# Fördergeschwindigkeit (mm/s), Beschleunigung und Bremsrampe (mm/s^2)
velocity: 30
accel: 300
#decel: 300             # Default: accel
# Startgeschwindigkeit der Rampe (mm/s)
#start_velocity: 2.0
#poll_interval: 0.005   # Abfrageintervall der Sensoren in der MCU (s)
#trigger_debounce: 0.010
#stop_samples: 2        # Abtastungen vor jedem Schritt bis Stop-Sensor gilt
# Wenn der Trigger-Sensor nach dieser Anzahl Läufe in Folge noch aktiv ist
# (z.B. Stau), wird das Nachschieben gestoppt und fault_gcode ausgeführt.
#max_runs: 3
fault_gcode:
  M118 Puffer feeder1: Filament wird nicht nachgefördert

# --- Laden (Sensor 1 -> Sensor 2) ------------------------------------------
# Sensor 1 vor dem Vorförderer: startet den Ladevorgang
entry_pin: ^!station:PA2
# Sensor 2 hinter dem Vorförderer: beendet den Ladevorgang
exit_pin: ^!station:PA3
#load_velocity: 20      # Default: velocity
#load_accel: 200        # Default: accel
#load_decel: 200        # Default: load_accel
#load_start_velocity: 2 # Default: start_velocity
# Löst Sensor 2 in dieser Zeit (s) nicht aus: Abbruch und Fehler
load_timeout: 8
# Strecke (mm), die nach dem Auslösen von Sensor 2 noch gefahren wird.
# Positiv = weiter in Förderrichtung (Bremsrampe ist enthalten), negativ =
# anhalten und dann zurückfahren. Bei Förderung weiter sollte der Wert größer
# als die Bremsstrecke sein.
load_clear_distance: 15
#entry_debounce: 0.010
#exit_samples: 2
load_fault_gcode:
  M118 Laden fehlgeschlagen: Filament hat Sensor 2 nicht erreicht

# Beim Start des Druckers automatisch aktivieren (Default: True)
#enable: True
# Treiber beim Aktivieren automatisch einschalten (Default: True)
#enable_stepper: True


# --- Taster (nativ in Klipper) -----------------------------------------------
# BUFFER_FEED_MOVE kehrt sofort zurück, die MCU führt die Bewegung selbstständig
# aus und stoppt (mit Rampe) am gewählten Sensor. Negative DISTANCE = rückwärts.
# Soll danach etwas anderes (z.B. ein zweiter Move) folgen, muss auf das Ende
# gewartet werden: WAIT=1 am Befehl oder ein eigener BUFFER_FEED_WAIT. Sonst
# lehnt die MCU den zweiten Befehl als "busy" ab (Fehlermeldung in der Konsole).

# Taster 1: Laden bis der Puffer voll ist (Beispiel, Ablauf/Zustandsabfragen
# nach Bedarf erweitern).
#[gcode_button feeder1_load]
#pin: ^!station:PA7
#press_gcode:
#  FEEDER1_LOAD
#
#[gcode_macro FEEDER1_LOAD]
#gcode:
#  SET_BUFFER_FEED BUFFER=feeder1 ENABLE=1
#  BUFFER_FEED_MOVE BUFFER=feeder1 DISTANCE=600 STOP=full

# Taster 2: Entladen. Zuerst zurück bis Sensor 2 (exit) frei ist, dann noch
# eine feste Strecke ohne Sensor. Vorher die Automatik abschalten (ENABLE=0
# bricht eine laufende Bewegung ab), sonst schiebt der Puffer-Trigger beim
# Zurückziehen sofort wieder nach. Mit ENABLE=1 am Ende wieder einschalten
# (liegt dann noch Filament an Sensor 1, startet dadurch kein Laden).
#[gcode_button feeder1_unload]
#pin: ^!station:PA8
#press_gcode:
#  FEEDER1_UNLOAD
#
#[gcode_macro FEEDER1_UNLOAD]
#gcode:
#  SET_BUFFER_FEED BUFFER=feeder1 ENABLE=0
#  BUFFER_FEED_MOVE BUFFER=feeder1 DISTANCE=-2000 STOP=exit STOP_ON=RELEASE WAIT=1
#  BUFFER_FEED_MOVE BUFFER=feeder1 DISTANCE=-400 STOP=none WAIT=1
#  SET_BUFFER_FEED BUFFER=feeder1 ENABLE=1
