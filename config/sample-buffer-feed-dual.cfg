# Example: two pre-feeders into a Y splitter with one spring buffer (see
# docs/Buffer_Feed.md)
#
#   entry_pin_t0 -> pre-feeder t0 -> exit_pin_t0 --\
#                                                   Y -> gate_pin -> buffer (buffer_low_pin / buffer_high_pin)
#   entry_pin_t1 -> pre-feeder t1 -> exit_pin_t1 --/
#
# One channel (the active channel) feeds into the buffer. The other one is
# preloaded up to just before its exit sensor. When the active channel runs
# out and the end of the filament has passed gate_pin, the other channel
# feeds once until the buffer is full and then takes over.
#
# For one buffer per pre-feeder see sample-buffer-feed.cfg.

[mcu station]
canbus_uuid: 0123456789ab


# --- Pre-feeders ----------------------------------------------------------------
[manual_stepper prefeeder_t0]
step_pin: station:STATION_STEPPER_T0_STEP
dir_pin: station:STATION_STEPPER_T0_DIR
enable_pin: !station:STATION_STEPPER_T0_EN
microsteps: 16
rotation_distance: 22
gear_ratio: 50:10
full_steps_per_rotation: 200
velocity: 50
accel: 5000

[tmc2209 manual_stepper prefeeder_t0]
uart_pin: station:STATION_STEPPER_T0_UART
interpolate: false
run_current: 0.70
sense_resistor: 0.110
stealthchop_threshold: 0

[manual_stepper prefeeder_t1]
step_pin: station:STATION_STEPPER_T1_STEP
dir_pin: station:STATION_STEPPER_T1_DIR
enable_pin: !station:STATION_STEPPER_T1_EN
microsteps: 16
rotation_distance: 22
gear_ratio: 50:10
full_steps_per_rotation: 200
velocity: 50
accel: 5000

[tmc2209 manual_stepper prefeeder_t1]
uart_pin: station:STATION_STEPPER_T1_UART
interpolate: false
run_current: 0.70
sense_resistor: 0.110
stealthchop_threshold: 0


# --- Buffer with two channels -------------------------------------------------
[buffer_feed station]
# Shared buffer sensors
buffer_low_pin: ^station:STATION_T0_BUF0
buffer_high_pin: ^station:STATION_T0_BUF2
# Filament has arrived at the buffer. Feeding only while active. When it
# releases, gate_release_gcode runs (channel switch).
gate_pin: ^station:STATION_T0_BUF1

# Channel t0
stepper_t0: manual_stepper prefeeder_t0
entry_pin_t0: ^station:STATION_T0_SW0
exit_pin_t0: ^station:STATION_T0_SW1
# Channel t1
stepper_t1: manual_stepper prefeeder_t1
entry_pin_t1: ^station:STATION_T1_SW0
exit_pin_t1: ^station:STATION_T1_SW1

# Feeding: choose distance so that buffer_high_pin is not normally reached
distance: 40
velocity: 30
accel: 2000
#max_runs: 3
# When buffer_high_pin triggers, move back until it releases (mm per run)
retract_distance: 5
# Retract runs in a row while buffer_high_pin stays active until a fault
#retract_max_runs: 10
# Unload (BUFFER_FEED_UNLOAD): maximum distance back until the exit sensor
# releases, then until the entry sensor releases (mm)
#unload_exit_distance: 2000
#unload_entry_distance: 600

# Loading entry -> exit (same for both channels). -2 = preload position just
# before the exit sensor.
load_timeout: 45
load_clear_distance: -2

fault_gcode:
  M118 Buffer {params.BUFFER}: filament is not fed ({params.CHANNEL}, {params.REASON})
load_fault_gcode:
  M118 Buffer {params.BUFFER}: loading {params.CHANNEL} failed, filament did not reach the exit sensor
runout_gcode:
  M118 Buffer {params.BUFFER}: channel {params.CHANNEL} ran out of filament
gate_release_gcode:
  _BUFFER_GATE_RELEASED BUFFER={params.BUFFER}
# Runs when the state of a channel changes: empty, preloaded, loaded, error
state_gcode:
  _FEEDER_LED CHANNEL={params.CHANNEL} STATE={params.STATE}


# --- Channel switch -------------------------------------------------------------
# Runs when gate_pin releases. Switches to the other channel during a print
# if the active channel has no filament at its entry sensor and the other one
# has.
[gcode_macro _BUFFER_GATE_RELEASED]
gcode:
  {% set name = params.BUFFER %}
  {% set bf = printer["buffer_feed " ~ name] %}
  {% set act = bf.active_channel %}
  {% if act and "t1" in bf.channels and printer.print_stats.state == "printing" %}
    {% set other = "t1" if act == "t0" else "t0" %}
    {% if not bf.channels[act].entry %}
      {% if bf.channels[other].entry %}
        M118 Buffer {name}: {act} is empty, switching to {other}
        SET_BUFFER_FEED BUFFER={name} CHANNEL={act} FEED=0
        SET_BUFFER_FEED BUFFER={name} CHANNEL={other} FEED=1
        # Feed once until the buffer is full, then normal feeding takes over.
        # No WAIT=1, the print would stop until the move is done.
        BUFFER_FEED_MOVE BUFFER={name} CHANNEL={other} DISTANCE=500 STOP=high
      {% else %}
        M118 Buffer {name}: {act} is empty, no filament on {other}
      {% endif %}
    {% endif %}
  {% endif %}


# --- Status LEDs ------------------------------------------------------------------
[neopixel feeder_t0]
pin: station:STATION_T0_NEOPIXEL
color_order: GRB
chain_count: 1

[neopixel feeder_t1]
pin: station:STATION_T1_NEOPIXEL
color_order: GRB
chain_count: 1

# One color per channel state. SYNC=0: change at once, not at the end of the
# print queue.
[gcode_macro _FEEDER_LED]
gcode:
  {% set colors = {"empty": (0.0, 0.0, 0.0),
                   "preloaded": (0.0, 0.0, 0.8),
                   "loaded": (0.0, 0.82, 0.47),
                   "error": (1.0, 0.0, 0.0)} %}
  {% set c = colors.get(params.STATE, (0.3, 0.3, 0.3)) %}
  SET_LED LED=feeder_{params.CHANNEL} RED={c[0]} GREEN={c[1]} BLUE={c[2]} SYNC=0


# --- Buttons --------------------------------------------------------------------
# Short press: load (button 1) or unload (button 2) the channel, started when
# the button is released. Holding a button for 1 s aborts a running load or
# unload of the channel.
[gcode_button feeder_load_t0]
pin: ^!station:STATION_T0_BUT0
press_gcode:
  _FEEDER_BUTTON CHANNEL=t0 EVENT=press
release_gcode:
  _FEEDER_BUTTON CHANNEL=t0 EVENT=release ACTION=FEEDER_LOAD_T0

[gcode_button feeder_unload_t0]
pin: ^!station:STATION_T0_BUT1
press_gcode:
  _FEEDER_BUTTON CHANNEL=t0 EVENT=press
release_gcode:
  _FEEDER_BUTTON CHANNEL=t0 EVENT=release ACTION=FEEDER_UNLOAD_T0

[gcode_button feeder_load_t1]
pin: ^!station:STATION_T1_BUT0
press_gcode:
  _FEEDER_BUTTON CHANNEL=t1 EVENT=press
release_gcode:
  _FEEDER_BUTTON CHANNEL=t1 EVENT=release ACTION=FEEDER_LOAD_T1

[gcode_button feeder_unload_t1]
pin: ^!station:STATION_T1_BUT1
press_gcode:
  _FEEDER_BUTTON CHANNEL=t1 EVENT=press
release_gcode:
  _FEEDER_BUTTON CHANNEL=t1 EVENT=release ACTION=FEEDER_UNLOAD_T1

[gcode_macro _FEEDER_BUTTON]
variable_held_t0: False
variable_held_t1: False
gcode:
  {% set ch = params.CHANNEL %}
  {% if params.EVENT == "press" %}
    SET_GCODE_VARIABLE MACRO=_FEEDER_BUTTON VARIABLE=held_{ch} VALUE=False
    UPDATE_DELAYED_GCODE ID=_feeder_hold_{ch} DURATION=1
  {% else %}
    UPDATE_DELAYED_GCODE ID=_feeder_hold_{ch} DURATION=0
    {% if not printer["gcode_macro _FEEDER_BUTTON"]["held_" ~ ch] %}
      {params.ACTION}
    {% endif %}
  {% endif %}

[delayed_gcode _feeder_hold_t0]
gcode:
  SET_GCODE_VARIABLE MACRO=_FEEDER_BUTTON VARIABLE=held_t0 VALUE=True
  BUFFER_FEED_ABORT BUFFER=station CHANNEL=t0
  M118 Buffer station: t0 aborted

[delayed_gcode _feeder_hold_t1]
gcode:
  SET_GCODE_VARIABLE MACRO=_FEEDER_BUTTON VARIABLE=held_t1 VALUE=True
  BUFFER_FEED_ABORT BUFFER=station CHANNEL=t1
  M118 Buffer station: t1 aborted

# Load until the buffer is full, only with filament at the entry sensor.
# FEED=1 makes the channel the active channel. This is refused while the
# other channel is loaded through to the buffer.
[gcode_macro FEEDER_LOAD_T0]
gcode:
  {% if printer["buffer_feed station"].channels.t0.entry %}
    SET_BUFFER_FEED BUFFER=station CHANNEL=t0 FEED=1
    BUFFER_FEED_MOVE BUFFER=station CHANNEL=t0 DISTANCE=3000 STOP=high
  {% else %}
    M118 Buffer station: no filament at t0, insert it first
  {% endif %}

[gcode_macro FEEDER_LOAD_T1]
gcode:
  {% if printer["buffer_feed station"].channels.t1.entry %}
    SET_BUFFER_FEED BUFFER=station CHANNEL=t1 FEED=1
    BUFFER_FEED_MOVE BUFFER=station CHANNEL=t1 DISTANCE=3000 STOP=high
  {% else %}
    M118 Buffer station: no filament at t1, insert it first
  {% endif %}

# Unload until the filament has left the entry sensor. BUFFER_FEED_UNLOAD
# switches feeding and loading of the channel off, moves back until the exit
# sensor and then the entry sensor release, and switches loading on again.
# It returns at once, so the hold-to-abort above works during the unload.
[gcode_macro FEEDER_UNLOAD_T0]
gcode:
  BUFFER_FEED_UNLOAD BUFFER=station CHANNEL=t0

[gcode_macro FEEDER_UNLOAD_T1]
gcode:
  BUFFER_FEED_UNLOAD BUFFER=station CHANNEL=t1
